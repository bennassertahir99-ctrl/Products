<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SB Import & Export – Prototype</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#f4f7fc;--card:#fff;--ink:#0f1b33;--mut:#5d6b86;--line:#e3e9f4;--pri:#2563eb;--navy:#0f1d36;--ok:#16794a;--okb:#dcf5e7;--wa:#a35a00;--wab:#fdecc8;--er:#c0262d;--erb:#fde1e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1322;--card:#131f36;--ink:#e8eefb;--mut:#93a2c1;--line:#22314f;--navy:#0a1325;--okb:#143826;--ok:#6fdca0;--wab:#3d2d0c;--wa:#f5c46b;--erb:#40161a;--er:#ff9a9f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1322;--card:#131f36;--ink:#e8eefb;--mut:#93a2c1;--line:#22314f;--navy:#0a1325;--okb:#143826;--ok:#6fdca0;--wab:#3d2d0c;--wa:#f5c46b;--erb:#40161a;--er:#ff9a9f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.lhero{background:linear-gradient(160deg,#0f1d36,#17356b);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center}
.lhero h1{font-size:44px;line-height:1.05;margin:0 0 14px}.lhero h1 b{color:#5b8cff}
.lbox{display:flex;flex-direction:column;justify-content:center;padding:48px;max-width:460px;margin:auto;width:100%}
.lbox h2{font-size:34px;margin:0}.lbox p{color:var(--mut);margin:4px 0 22px}
label{font-weight:600;font-size:13px;display:block;margin:12px 0 5px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.full{width:100%;margin-top:18px}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--navy);color:#cfd9ee;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{color:#fff;font-weight:700;font-size:17px;padding:4px 10px 16px}
aside button{display:block;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:9px;cursor:pointer}
aside button.on{background:#1f4fbf;color:#fff}aside button:hover:not(.on){background:#17294a}
main{padding:22px 26px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:30px}.top small{color:var(--mut)}
.badge{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--mut);margin-left:6px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.7fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 8px;font-size:16px}
.kpi small{color:var(--mut)}.kpi b{display:block;font-size:26px;margin:4px 0}
.kpi.dark{background:#10244a;color:#fff;border-color:#10244a}.kpi.dark small{color:#b8c7e8}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mut);font-weight:600;text-align:left;font-size:12px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.pill{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.ok{background:var(--okb);color:var(--ok)}.wa{background:var(--wab);color:var(--wa)}.er{background:var(--erb);color:var(--er)}
.bar{height:7px;border-radius:9px;background:var(--line);margin-top:5px}.bar i{display:block;height:100%;border-radius:9px;background:var(--pri)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{width:100%;max-width:440px}
.err{color:var(--er);font-size:13px;min-height:18px}
.qr{width:34px;height:34px;display:block}
@media(max-width:860px){#login{grid-template-columns:1fr}.lhero{display:none}
#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px}.brand{display:none}aside button{white-space:nowrap}
.k4{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}main{padding:16px}}
@media(max-width:480px){.k4{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="login">
  <div class="lhero"><div style="font-weight:700;margin-bottom:28px">SB Import &amp; Export</div>
    <h1>Votre activité.<br><b>Un seul espace.</b></h1><p style="opacity:.8">Gérez vos stocks, vos ventes et vos importations.</p></div>
  <div class="lbox">
    <h2>Connexion</h2><p>Accédez à votre espace de gestion.</p>
    <label for="em">Adresse e-mail</label><input id="em" type="email" placeholder="Votre adresse e-mail">
    <label for="pw">Mot de passe</label><input id="pw" type="password" placeholder="Votre mot de passe">
    <button class="btn full" onclick="enter()">Se connecter</button>
    <p style="font-size:13px;margin-top:16px">Prototype : entrez n’importe quelles valeurs.</p>
  </div>
</section>
<div id="app" class="hide">
  <aside>
    <div class="brand">SB Import &amp; Export</div>
    <button data-v="dash" class="on">Vue d’ensemble</button>
    <button data-v="stock">Stock &amp; produits</button>
    <button data-v="achats">Achats &amp; importations</button>
    <button data-v="ventes">Ventes</button>
    <button data-v="clients">Clients</button>
    <button data-v="fin">Finances</button>
    <button data-v="arch">Archives fournisseurs</button>
    <button data-v="hist">Historique &amp; imports</button>
    <button data-v="reset" style="margin-top:auto">Réinitialiser les données</button>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" class="modal hide"></div>
<script>
var P=[
{r:'P001',n:'Whey Protein 2 kg',c:'Protéines',q:127,cost:310,pr:420,lot:'L2409',exp:'2027-08-30'},
{r:'P002',n:'Créatine 300 g',c:'Performance',q:90,cost:95,pr:140,lot:'L2408',exp:'2027-05-15'},
{r:'P003',n:'Magnésium B6',c:'Vitamines',q:60,cost:48,pr:75,lot:'L2406',exp:'2026-12-20'},
{r:'P004',n:'BCAA 400 g',c:'Acides aminés',q:35,cost:120,pr:175,lot:'L2410',exp:'2027-03-10'},
{r:'P005',n:'Oméga 3',c:'Vitamines',q:70,cost:70,pr:110,lot:'L2405',exp:'2026-12-05'}];
var C=['Atlas Nutrition','Vital Sport','Nutri Shop','Forme Plus'];
var S=[];
[['2026-06-12','Atlas Nutrition','P001',20,1],['2026-07-08','Vital Sport','P002',30,1],['2026-08-14','Nutri Shop','P001',25,1],
['2026-09-10','Forme Plus','P004',40,.5],['2026-10-05','Atlas Nutrition','P001',30,1],['2026-10-21','Vital Sport','P002',25,1],
['2026-11-01','Nutri Shop','P003',40,0],['2026-11-02','Forme Plus','P001',18,.5]].forEach(function(s){
 var p=P.find(function(x){return x.r==s[2]});var t=s[3]*p.pr;S.push({d:s[0],c:s[1],r:s[2],q:s[3],pr:p.pr,paid:Math.round(t*s[4])});});
var A=[{d:'2026-08-30',f:'EuroSport Nutrition GmbH',ad:'Hambourg, Allemagne',r:'P001',q:150,pu:240,tr:6000,du:9000,ot:1500,paid:30000}];
try{var sv0=JSON.parse(localStorage.getItem('sb1'));if(sv0){P=sv0.P;C=sv0.C;S=sv0.S;A=sv0.A}}catch(e){}
function save(){try{localStorage.setItem('sb1',JSON.stringify({P:P,C:C,S:S,A:A}))}catch(e){}}
var view='dash',$=function(i){return document.getElementById(i)};
function m(n){return Math.round(n).toLocaleString('fr-FR')+' MAD'}
function pf(r){return P.find(function(x){return x.r==r})}
function tot(s){return s.q*s.pr}
function cur(){return new Date().toISOString().slice(0,7)}
function fd(d){return d.split('-').reverse().join('/')}
function st(s){var t=tot(s);return s.paid>=t?['Payée','ok']:s.paid>0?['Partielle','wa']:['À régler','er']}
function enter(){$('login').classList.add('hide');$('app').classList.remove('hide');go('dash')}
document.querySelectorAll('aside button').forEach(function(b){b.onclick=function(){go(b.dataset.v)}});
function go(v){if(v=='reset'){if(confirm('Effacer vos saisies et revenir aux données de démonstration ?')){try{localStorage.removeItem('sb1')}catch(e){}location.reload()}return}view=v;document.querySelectorAll('aside button').forEach(function(b){b.classList.toggle('on',b.dataset.v==v)});render()}
function head(t,sub,btn){return '<div class="top"><div><h1>'+t+'</h1><small>'+sub+'</small><span class="badge">Données de démonstration</span></div>'+(btn||'')+'</div>'}
var nb='<button class="btn" onclick="sale()">+ Nouvelle vente</button>';
function render(){
 var h='';
 if(view=='dash')h=dash();else if(view=='stock')h=stock();else if(view=='ventes')h=ventes();else if(view=='clients')h=clients();else if(view=='fin')h=fin();else if(view=='achats')h=achats();else if(view=='arch')h=arch();
 else h=head('Module à venir','Prévu dans la version complète')+'<div class="card">L’import Excel 2024, 2025 et 2026 se fait une seule fois au lancement, en conservant la date exacte de chaque vente et de chaque achat. Ensuite, 2027, 2028… se remplissent automatiquement.</div>';
 $('main').innerHTML=h;
}
function month(ym){return S.filter(function(s){return s.d.slice(0,7)==ym})}
function ca(a){return a.reduce(function(x,s){return x+tot(s)},0)}
function ben(a){return a.reduce(function(x,s){return x+s.q*(s.pr-pf(s.r).cost)},0)}
function dash(){
 var ym=cur(),ms=month(ym),yr=S.filter(function(s){return s.d.slice(0,4)==ym.slice(0,4)});
 var sv=P.reduce(function(x,p){return x+p.q*p.cost},0),due=S.reduce(function(x,s){return x+tot(s)-s.paid},0),paid=ca(ms)?ms.reduce(function(x,s){return x+s.paid},0):0;
 var soon=P.filter(function(p){return (new Date(p.exp)-new Date())/864e5<90}).length;
 var mo=[];for(var i=5;i>=0;i--){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);var k=d.toISOString().slice(0,7);mo.push([d.toLocaleDateString('fr-FR',{month:'short'}),ca(month(k))])}
 var mx=Math.max.apply(null,mo.map(function(x){return x[1]}))||1,pts=mo.map(function(x,i){return [40+i*(520/5),170-x[1]/mx*140]});
 var line=pts.map(function(p){return p.join(',')}).join(' ');
 var chart='<svg viewBox="0 0 600 200" style="width:100%;height:auto"><polyline points="'+line+'" fill="none" stroke="var(--pri)" stroke-width="3"/>'+pts.map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="var(--pri)"/><text x="'+p[0]+'" y="192" text-anchor="middle" font-size="12" fill="var(--mut)">'+mo[i][0]+'</text><text x="'+p[0]+'" y="'+(p[1]-10)+'" text-anchor="middle" font-size="11" fill="var(--ink)">'+Math.round(mo[i][1]/1000)+'k</text>'}).join('')+'</svg>';
 var tt=paid+(ca(ms)-paid)||1,pc=Math.round(paid/tt*100),cir=2*Math.PI*52;
 var don='<svg viewBox="0 0 140 140" width="130"><circle cx="70" cy="70" r="52" fill="none" stroke="var(--line)" stroke-width="18"/><circle cx="70" cy="70" r="52" fill="none" stroke="var(--pri)" stroke-width="18" stroke-dasharray="'+(cir*pc/100)+' '+cir+'" transform="rotate(-90 70 70)"/><text x="70" y="76" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">'+pc+' %</text></svg>';
 var top=P.map(function(p){return [p,S.filter(function(s){return s.r==p.r}).reduce(function(x,s){return x+s.q},0)]}).sort(function(a,b){return b[1]-a[1]}).slice(0,3),tm=top[0][1]||1;
 return head('Vue d’ensemble','Vos ventes, vos finances et votre stock.',nb)+
 '<div class="grid k4"><div class="card kpi dark"><small>Chiffre d’affaires du mois</small><b>'+m(ca(ms))+'</b><small>Année : '+m(ca(yr))+'</small></div>'+
 '<div class="card kpi"><small>Bénéfice du mois</small><b>'+m(ben(ms))+'</b><small>Année : '+m(ben(yr))+'</small></div>'+
 '<div class="card kpi"><small>Valeur du stock</small><b>'+m(sv)+'</b><span class="pill wa">'+soon+' lots à surveiller</span></div>'+
 '<div class="card kpi"><small>À recevoir des clients</small><b>'+m(due)+'</b><small>'+C.length+' clients au total</small></div></div>'+
 '<div class="grid two" style="margin-top:14px"><div class="card"><h3>Évolution du chiffre d’affaires</h3>'+chart+'</div>'+
 '<div class="card"><h3>Encaissements du mois</h3><div class="row">'+don+'<div><small>Encaissé</small><br><b>'+m(paid)+'</b><br><small>À recevoir</small><br><b>'+m(ca(ms)-paid)+'</b><br><small>Transport + douane</small><br><b>'+m(A.reduce(function(x,a){return x+a.tr+a.du},0))+'</b></div></div></div></div>'+
 '<div class="grid two" style="margin-top:14px"><div class="card sc"><h3>Dernières ventes</h3>'+stab(S.slice().reverse().slice(0,5))+'</div>'+
 '<div class="card"><h3>Produits les plus vendus</h3>'+top.map(function(t,i){return '<div style="margin:10px 0"><b>'+(i+1)+'. '+t[0].n+'</b> <small>'+t[1]+' unités</small><div class="bar"><i style="width:'+t[1]/tm*100+'%"></i></div></div>'}).join('')+'</div></div>'+
 '<p><small>Bénéfice simplifié = chiffre d’affaires − coût réel des produits vendus (par lot).</small></p>';
}
function stab(a){return '<table><tr><th>Date</th><th>Client</th><th>Produit</th><th>Montant</th><th>Statut</th></tr>'+a.map(function(s){var x=st(s);return '<tr><td>'+fd(s.d)+'</td><td>'+s.c+'</td><td>'+pf(s.r).n+' ×'+s.q+'</td><td>'+m(tot(s))+'</td><td><span class="pill '+x[1]+'">'+x[0]+'</span></td></tr>'}).join('')+'</table>'}
function qr(r){var h='',s=0;for(var i=0;i<r.length;i++)s=s*31+r.charCodeAt(i);for(var y=0;y<7;y++)for(var x=0;x<7;x++){s=(s*1103515245+12345)&0x7fffffff;if(s&8)h+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}return '<svg class="qr" viewBox="0 0 7 7" fill="currentColor">'+h+'</svg>'}
function stock(){
 return head('Stock & produits','Recherche par nom, référence ou code QR.')+'<div class="card sc"><input id="q" placeholder="Rechercher un produit ou une référence…" oninput="fs()" style="max-width:360px;margin-bottom:10px"><div id="tb">'+stt('')+'</div></div>';
}
function fs(){$('tb').innerHTML=stt($('q').value)}
function stt(q){q=q.toLowerCase();var a=P.filter(function(p){return (p.n+p.r+p.c).toLowerCase().indexOf(q)>-1});
 return '<table><tr><th>QR</th><th>Réf.</th><th>Produit</th><th>Catégorie</th><th>Lot</th><th>Expiration</th><th>Stock</th><th>Coût unit.</th><th>Valeur</th></tr>'+a.map(function(p){
 var d=(new Date(p.exp)-new Date())/864e5,c=d<90?'er':d<180?'wa':'ok';
 return '<tr><td>'+qr(p.r)+'</td><td>'+p.r+'</td><td>'+p.n+'</td><td>'+p.c+'</td><td>'+p.lot+'</td><td><span class="pill '+c+'">'+fd(p.exp)+'</span></td><td>'+p.q+'</td><td>'+m(p.cost)+'</td><td>'+m(p.q*p.cost)+'</td></tr>'}).join('')+'</table>'}
function achats(){return head('Achats & importations','Coût réel par unité = (prix + transport + douane + frais) ÷ quantité.','<button class="btn" onclick="buy()">+ Nouvel achat</button>')+'<div class="card sc"><table><tr><th>Date</th><th>Fournisseur</th><th>Produit</th><th>Qté</th><th>Coût total</th><th>Coût réel / unité</th><th>Payé</th><th>Reste</th></tr>'+A.slice().reverse().map(function(a){var t=a.q*a.pu+a.tr+a.du+a.ot;return '<tr><td>'+fd(a.d)+'</td><td>'+a.f+'<br><small>'+a.ad+'</small></td><td>'+pf(a.r).n+'</td><td>'+a.q+'</td><td>'+m(t)+'</td><td><b>'+m(t/a.q)+'</b></td><td>'+m(a.paid)+'</td><td>'+m(t-a.paid)+'</td></tr>'}).join('')+'</table></div>'}
function buy(){$('modal').classList.remove('hide');$('modal').innerHTML='<div class="card"><h3>Nouvel achat</h3><label>Fournisseur</label><input id="bf" placeholder="Nom du fournisseur"><label>Adresse</label><input id="ba" placeholder="Ville, pays"><label>Produit</label><select id="bp">'+P.map(function(p){return '<option value="'+p.r+'">'+p.n+'</option>'}).join('')+'</select><div class="row"><div style="flex:1"><label>Quantité</label><input id="bq" type="number" value="100"></div><div style="flex:1"><label>Prix d’achat unitaire</label><input id="bu" type="number" value="0"></div></div><div class="row"><div style="flex:1"><label>Transport</label><input id="bt" type="number" value="0"></div><div style="flex:1"><label>Douane</label><input id="bd" type="number" value="0"></div></div><label>Autres frais</label><input id="bo" type="number" value="0"><label>Montant payé (MAD)</label><input id="bm" type="number" value="0"><div class="err" id="se"></div><div class="row" style="margin-top:8px"><button class="btn" onclick="bok()">Enregistrer</button><button class="btn g" onclick="cl()">Annuler</button></div></div>'}
function bok(){var p=pf($('bp').value),q=+$('bq').value,u=+$('bu').value,tr=+$('bt').value||0,du=+$('bd').value||0,ot=+$('bo').value||0;
if(!$('bf').value||!(q>0)||!(u>0))return $('se').textContent='Renseignez le fournisseur, la quantité et le prix.';
var t=q*u+tr+du+ot;p.cost=Math.round((p.q*p.cost+t)/(p.q+q)*100)/100;p.q+=q;
A.push({d:new Date().toISOString().slice(0,10),f:$('bf').value,ad:$('ba').value,r:p.r,q:q,pu:u,tr:tr,du:du,ot:ot,paid:Math.min(+$('bm').value||0,t)});save();cl();render()}
function arch(){var g={};A.forEach(function(a){g[a.f]=g[a.f]||{};var y=a.d.slice(0,4);(g[a.f][y]=g[a.f][y]||[]).push(a)});
return head('Archives fournisseurs','Fournisseur → année → achats et factures, conservés sans limite.')+Object.keys(g).map(function(f){return '<div class="card" style="margin-bottom:12px"><h3>'+f+'</h3>'+Object.keys(g[f]).sort().map(function(y){return '<p><b>'+y+'</b> : '+g[f][y].map(function(a){return fd(a.d)+' – '+pf(a.r).n+' – '+m(a.q*a.pu+a.tr+a.du+a.ot)}).join(' | ')+'</p>'}).join('')+'</div>'}).join('')}
function ventes(){return head('Ventes','Chaque vente garde sa date exacte.',nb)+'<div class="card sc">'+stab(S.slice().reverse())+'</div>'}
function clients(){return head('Clients','Historique, paiements et reste à payer.')+'<div class="card sc"><table><tr><th>Client</th><th>Achats</th><th>Total acheté</th><th>Payé</th><th>Reste à payer</th></tr>'+C.map(function(c){var a=S.filter(function(s){return s.c==c}),p=a.reduce(function(x,s){return x+s.paid},0);return '<tr><td>'+c+'</td><td>'+a.length+'</td><td>'+m(ca(a))+'</td><td>'+m(p)+'</td><td><b>'+m(ca(a)-p)+'</b></td></tr>'}).join('')+'</table></div>'}
function fin(){var t=new Date().toISOString().slice(0,10),ym=cur(),yr=ym.slice(0,4),d=S.filter(function(s){return s.d==t}),mm=month(ym),y=S.filter(function(s){return s.d.slice(0,4)==yr});
 function k(l,v){return '<div class="card kpi"><small>'+l+'</small><b>'+m(v)+'</b></div>'}
 return head('Finances','Calcul automatique à chaque vente.')+'<div class="grid k4">'+k('CA journalier',ca(d))+k('CA mensuel',ca(mm))+k('CA annuel',ca(y))+k('Bénéfice mensuel',ben(mm))+k('Bénéfice annuel',ben(y))+'</div>'}
function sale(){
 $('modal').classList.remove('hide');
 $('modal').innerHTML='<div class="card"><h3>Nouvelle vente</h3><label>Client</label><select id="sc">'+C.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select>'+
 '<label>Produit</label><select id="sp" onchange="sf()">'+P.map(function(p){return '<option value="'+p.r+'">'+p.n+' (stock '+p.q+')</option>'}).join('')+'</select>'+
 '<div class="row"><div style="flex:1"><label>Quantité</label><input id="sq" type="number" min="1" value="1" oninput="sf(1)"></div><div style="flex:1"><label>Prix unitaire</label><input id="sx" type="number"></div></div>'+
 '<label>Montant payé (MAD)</label><input id="sa" type="number" value="0"><div class="err" id="se"></div>'+
 '<div class="row" style="margin-top:8px"><button class="btn" onclick="ok()">Enregistrer</button><button class="btn g" onclick="cl()">Annuler</button></div></div>';sf();
}
function sf(k){if(!k)$('sx').value=pf($('sp').value).pr}
function cl(){$('modal').classList.add('hide')}
function ok(){var p=pf($('sp').value),q=+$('sq').value,x=+$('sx').value;
 if(!(q>0))return $('se').textContent='Entrez une quantité valide.';
 if(q>p.q)return $('se').textContent='Stock insuffisant : '+p.q+' disponibles.';
 p.q-=q;S.push({d:new Date().toISOString().slice(0,10),c:$('sc').value,r:p.r,q:q,pr:x,paid:Math.min(+$('sa').value||0,q*x)});save();cl();render()}
</script>
</body>
</html>
